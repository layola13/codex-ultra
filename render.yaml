services:
  - type: web
    name: codex-ultra
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: CODEX_UI_HOST
        value: 0.0.0.0
      - key: CODEX_UI_TRUST_PROXY
        value: "1"
      - key: CODEX_UI_ALLOWED_ORIGINS
        value: "*"
