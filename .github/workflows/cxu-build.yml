name: cxu Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Build @codex-ui/shared
        run: bun --filter @codex-ui/shared build
      - name: Build web dist
        run: bun --filter @codex-ui/web build
      - name: Build linux-x64 binary
        run: node scripts/build-standalone-matrix.mjs linux-x64
      - name: Assemble platform package
        run: node packages/cxu/scripts/assemble-platform-pkgs.mjs
      - name: Pack linux-x64
        run: npm pack packages/cxu/platform-pkgs/@codex-ultra/cxu-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: cxu-linux-x64
          path: codex-ultra-cxu-linux-x64-*.tgz

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Build @codex-ui/shared
        run: bun --filter @codex-ui/shared build
      - name: Build web dist
        run: bun --filter @codex-ui/web build
      - name: Build linux-arm64 binary
        run: node scripts/build-standalone-matrix.mjs linux-arm64
      - name: Assemble platform package
        run: node packages/cxu/scripts/assemble-platform-pkgs.mjs
      - name: Pack linux-arm64
        run: npm pack packages/cxu/platform-pkgs/@codex-ultra/cxu-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cxu-linux-arm64
          path: codex-ultra-cxu-linux-arm64-*.tgz

  build-darwin-x64:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Build @codex-ui/shared
        run: bun --filter @codex-ui/shared build
      - name: Build web dist
        run: bun --filter @codex-ui/web build
      - name: Build darwin-x64 binary
        run: node scripts/build-standalone-matrix.mjs darwin-x64
      - name: Assemble platform package
        run: node packages/cxu/scripts/assemble-platform-pkgs.mjs
      - name: Pack darwin-x64
        run: npm pack packages/cxu/platform-pkgs/@codex-ultra/cxu-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: cxu-darwin-x64
          path: codex-ultra-cxu-darwin-x64-*.tgz

  build-darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Build @codex-ui/shared
        run: bun --filter @codex-ui/shared build
      - name: Build web dist
        run: bun --filter @codex-ui/web build
      - name: Build darwin-arm64 binary
        run: node scripts/build-standalone-matrix.mjs darwin-arm64
      - name: Assemble platform package
        run: node packages/cxu/scripts/assemble-platform-pkgs.mjs
      - name: Pack darwin-arm64
        run: npm pack packages/cxu/platform-pkgs/@codex-ultra/cxu-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cxu-darwin-arm64
          path: codex-ultra-cxu-darwin-arm64-*.tgz

  build-win32-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Build @codex-ui/shared
        run: bun --filter @codex-ui/shared build
      - name: Build web dist
        run: bun --filter @codex-ui/web build
      - name: Build win32-x64 binary
        run: node scripts/build-standalone-matrix.mjs win32-x64
      - name: Assemble platform package
        run: node packages/cxu/scripts/assemble-platform-pkgs.mjs
      - name: Pack win32-x64
        run: npm pack packages/cxu/platform-pkgs/@codex-ultra/cxu-win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: cxu-win32-x64
          path: codex-ultra-cxu-win32-x64-*.tgz

  publish-npm:
    needs: [build-linux-x64, build-linux-arm64, build-darwin-x64, build-darwin-arm64, build-win32-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Setup npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish platform packages
        run: |
          for pkg in artifacts/*/*.tgz; do
            npm publish "$pkg" --access public
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package
        run: npm publish packages/cxu --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}