name: Feature request
description: 提议改进 codex-ultra 的工作台或发布体验
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述真实使用场景和希望解决的问题。产品仓库只负责发布包、文档与反馈，不接收源码提交。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在遇到什么限制？谁会受到影响？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望看到的行为、界面或发布流程。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索重复 Issue。
          required: true
